<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img">
  <title>Bodenmasse: Laenge und Breite</title>
  <rect width="520" height="360" fill="#f4f6f9"/>

  <defs>
    <linearGradient id="floorGradBoden" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eef5"/>
      <stop offset="100%" stop-color="#d5dee8"/>
    </linearGradient>
  </defs>

  <!-- Gleiche Box wie Raum-Hilfe; Hoehenkanten nur dezent -->
  <polygon points="260,250 430,300 310,340 140,290" fill="url(#floorGradBoden)" stroke="#94a3b8" stroke-width="1.5"/>

  <polygon points="140,290 260,250 260,160 140,200" fill="#3A7BC8" fill-opacity="0.05" stroke="#94a3b8" stroke-width="1.1" stroke-opacity="0.35"/>
  <polygon points="260,250 430,300 430,210 260,160" fill="#64748b" fill-opacity="0.04" stroke="#94a3b8" stroke-width="1.1" stroke-opacity="0.35"/>

  <polyline points="140,200 310,250 430,210" fill="none" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 4" stroke-opacity="0.35"/>
  <line x1="310" y1="250" x2="310" y2="340" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="5 4" stroke-opacity="0.3"/>
  <polygon points="260,160 430,210 310,250 140,200" fill="#ffffff" fill-opacity="0.18"/>

  <!-- Vertikale Kanten dezent (keine Mass-Hoehe) -->
  <line x1="260" y1="250" x2="260" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="430" y1="300" x2="430" y2="210" stroke="#94a3b8" stroke-width="1.25" stroke-opacity="0.3"/>
  <line x1="140" y1="290" x2="140" y2="200" stroke="#94a3b8" stroke-width="1.25" stroke-opacity="0.3"/>

  <!-- Nur Bodenmasse: Laenge + Breite -->
  <line x1="260" y1="250" x2="430" y2="300" stroke="#3A7BC8" stroke-width="5" stroke-linecap="round"/>
  <line x1="260" y1="250" x2="140" y2="290" stroke="#eebb22" stroke-width="5" stroke-linecap="round"/>

  <circle cx="260" cy="250" r="5" fill="#0f172a"/>
  <circle cx="430" cy="300" r="4.5" fill="#3A7BC8"/>
  <circle cx="140" cy="290" r="4.5" fill="#eebb22"/>

  <text x="365" y="268" fill="#1B5FA8" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="15" transform="rotate(16 365 268)">L&#228;nge</text>
  <text x="155" y="262" fill="#a16207" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="15" transform="rotate(-18 155 262)">Breite</text>

  <text x="260" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">L&#228;nge &#215; Breite</text>
</svg>
